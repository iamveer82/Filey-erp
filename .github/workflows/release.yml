name: release build

# Desktop installers for macOS, Windows and Linux.
# Trigger: push a tag like `v1.0.0`, or run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action creates the GitHub Release, which needs write access to repo
# contents (otherwise: "Resource not accessible by integration").
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One runner at a time. Both jobs call tauri-action, which looks for a
      # draft release with this tag and creates one if it finds none — run them
      # together and each finds nothing, so the tag ends up with TWO draft
      # releases (v2.3.14 did) whose assets and latest.json have to be merged by
      # hand. Sequential means the second job finds the first job's release and
      # appends to it, giving one release with every platform in one latest.json.
      max-parallel: 1
      matrix:
        include:
          # deb + rpm only. tauri.conf sets targets "all", which on Linux also
          # builds an AppImage — and that step has failed on every single
          # release this project has ever cut ("failed to run linuxdeploy",
          # stderr swallowed by tauri). Because the bundler runs AppImage last
          # and one failure fails the job, the .deb and .rpm that had already
          # built successfully were never uploaded, so Linux shipped nothing at
          # all. Naming the two working formats explicitly gets Linux users
          # installers today. APPIMAGE_EXTRACT_AND_RUN=1 was tried and ruled
          # FUSE out, so re-adding "appimage" needs the real linuxdeploy error
          # first — likeliest suspect is the bun-compiled wa-bridge sidecar in
          # externalBin, which linuxdeploy also tries to resolve deps for.
          - os: ubuntu-22.04
            args: "--bundles deb,rpm"
          - os: windows-latest
            args: ""
          # macOS is UNSIGNED — no APPLE_* secrets are set, so Gatekeeper marks
          # the .dmg as from an unidentified developer and users must right-click
          # → Open once. Set APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY /
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID (needs a $99/yr Apple
          # Developer account) and it notarizes with no workflow change.
          #
          # Not universal: a universal build makes tauri look for BOTH sidecar
          # triples in one bundle. Two separate arch builds instead — each one
          # carries the sidecar it can actually run, and tauri-action appends
          # both to the same draft, so latest.json ends up with darwin-aarch64
          # and darwin-x86_64.
          - os: macos-latest
            args: ""
          # Intel Macs, cross-compiled from the arm64 runner: the Rust binary
          # needs the rustup target and the bun sidecar needs --target, or an
          # arm64 sidecar gets bundled into an x86_64 app and the bridge dies
          # on launch with no error a user could act on.
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            libssl-dev libxdo-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Host triple, plus the cross target on the rows that set one (Intel mac).
      # Empty `targets` is the action's own default, so the other rows are
      # unaffected.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Host and cross builds on the same runner would otherwise fight over
          # one cache entry.
          key: ${{ matrix.rust_target || 'host' }}

      - run: npm ci --no-audit --no-fund

      # The WhatsApp bridge ships as a Tauri sidecar so a QR-paired session can
      # start with the app instead of from a terminal. Compiled to a standalone
      # binary here (Baileys is Node-only), named with the target triple, which
      # is what externalBin resolves at bundle time.
      # Required, not optional: `externalBin` in tauri.conf.json now names this
      # binary, so tauri bundling fails without it. Letting the step continue on
      # error only buys a confusing failure two steps later.
      # Bun pinned: 1.4 migrates package-lock.json on install and drops
      # Baileys' git dependency on libsignal while doing it — 118 packages
      # instead of 119, and the compile below dies on "Could not resolve:
      # libsignal". 1.3.9 installs it. Unpin once bun handles a migrated git
      # dependency.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Build WhatsApp bridge sidecar
        shell: bash
        run: |
          cd tools/wa-bridge
          npm ci --no-audit --no-fund
          # Fail here, not three steps later inside the bundler.
          test -d node_modules/libsignal || { echo "libsignal missing"; exit 1; }
          # Cross builds name the sidecar for the TARGET, not the runner's host.
          TRIPLE="${{ matrix.rust_target }}"
          [ -n "$TRIPLE" ] || TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""
          [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          BUN_TARGET=""
          [ -n "${{ matrix.bun_target }}" ] && BUN_TARGET="--target=${{ matrix.bun_target }}"
          mkdir -p ../../src-tauri/binaries
          bun build --compile $BUN_TARGET index.mjs \
            --outfile "../../src-tauri/binaries/filey-wa-bridge-$TRIPLE$EXT"
          ls -la ../../src-tauri/binaries

      # Run after the bridge installs its own dependencies; its tests are part
      # of the root suite and need those imports even when transport is mocked.
      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Native storage and security fixtures
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Filey ERP {0}', github.ref_name) || '' }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No APPLE_* here on purpose. An unset secret still expands to an
          # empty string, and tauri treats a *present* APPLE_CERTIFICATE as
          # "sign this", then dies on `security import: failed to import
          # keychain certificate` — which is exactly how the macOS job failed
          # in v2.10.0. Absent vars build unsigned, which is what we want until
          # there's a real cert. To enable signing, add the secrets AND put
          # these back: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          # Two rows share macos-latest, and upload-artifact@v4 rejects a
          # duplicate artifact name outright — the arch has to be in it.
          name: filey-erp-${{ matrix.os }}-${{ matrix.rust_target || 'host' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            # Updater signatures — without these the artifacts can't be turned
            # into a working latest.json if the release upload ever needs redoing.
            src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: ignore

  # Every release from v2.6.0 through v2.9.0 reported "failure" and shipped
  # anyway: Windows uploaded, Linux silently did not, and the red run became
  # background noise. Linux was missing from every release this project ever
  # cut and nobody noticed. A green matrix is not proof the release is whole —
  # only the asset list is, so assert on that and fail loudly when a platform
  # goes missing.
  verify-release-assets:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Assert every platform uploaded its installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Assets on $TAG:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | tee assets.txt
          echo

          # One glob per installer we expect to ship. Keep this list in step
          # with the build matrix — adding a platform means adding its pattern.
          missing=0
          while read -r label pattern; do
            if grep -qE "$pattern" assets.txt; then
              echo "  ok      $label"
            else
              echo "  MISSING $label  (no asset matching /$pattern/)"
              missing=1
            fi
          done <<'PATTERNS'
          windows-nsis  _x64-setup\.exe$
          windows-msi   _x64_en-US\.msi$
          linux-deb     _amd64\.deb$
          linux-rpm     \.x86_64\.rpm$
          macos-arm     aarch64\.dmg$
          macos-intel   x64\.dmg$
          updater       ^latest\.json$
          PATTERNS

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Release $TAG is incomplete — a platform built green but shipped nothing."
            echo "Do not publish this draft until the gap is understood."
            exit 1
          fi
          echo
          echo "All expected installers present."

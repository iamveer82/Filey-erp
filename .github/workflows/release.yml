name: release build

# Desktop installers for macOS, Windows and Linux.
# Trigger: push a tag like `v1.0.0`, or run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action creates the GitHub Release, which needs write access to repo
# contents (otherwise: "Resource not accessible by integration").
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One runner at a time. Both jobs call tauri-action, which looks for a
      # draft release with this tag and creates one if it finds none — run them
      # together and each finds nothing, so the tag ends up with TWO draft
      # releases (v2.3.14 did) whose assets and latest.json have to be merged by
      # hand. Sequential means the second job finds the first job's release and
      # appends to it, giving one release with every platform in one latest.json.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          # macOS is UNSIGNED — no APPLE_* secrets are set, so Gatekeeper marks
          # the .dmg as from an unidentified developer and users must right-click
          # → Open once. Set APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY /
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID (needs a $99/yr Apple
          # Developer account) and it notarizes with no workflow change.
          #
          # arm64 only, not universal: the wa-bridge sidecar below is compiled
          # for the RUNNER's host triple, and a universal build makes tauri look
          # for an x86_64-apple-darwin sidecar too, which nothing produces.
          # For Intel Macs, cross-compile the sidecar with bun's --target first.
          - os: macos-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            libssl-dev libxdo-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Host triple only. macos-latest is already aarch64, and we don't build
      # universal (see the matrix note about the sidecar).
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # npm install (not ci): lockfile is Windows-generated and lacks the
      # linux-only optional native deps, so `npm ci` fails on the linux
      # runner. install reconciles per-platform.
      - run: npm install --no-audit --no-fund

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      # The WhatsApp bridge ships as a Tauri sidecar so a QR-paired session can
      # start with the app instead of from a terminal. Compiled to a standalone
      # binary here (Baileys is Node-only), named with the target triple, which
      # is what externalBin resolves at bundle time.
      # Required, not optional: `externalBin` in tauri.conf.json now names this
      # binary, so tauri bundling fails without it. Letting the step continue on
      # error only buys a confusing failure two steps later.
      # Bun pinned: 1.4 migrates package-lock.json on install and drops
      # Baileys' git dependency on libsignal while doing it — 118 packages
      # instead of 119, and the compile below dies on "Could not resolve:
      # libsignal". 1.3.9 installs it. Unpin once bun handles a migrated git
      # dependency.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Build WhatsApp bridge sidecar
        shell: bash
        run: |
          cd tools/wa-bridge
          bun install --frozen-lockfile || bun install
          # Fail here, not three steps later inside the bundler.
          test -d node_modules/libsignal || { echo "libsignal missing"; exit 1; }
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""
          [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p ../../src-tauri/binaries
          bun build --compile index.mjs \
            --outfile "../../src-tauri/binaries/filey-wa-bridge-$TRIPLE$EXT"
          ls -la ../../src-tauri/binaries

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Filey ERP {0}', github.ref_name) || '' }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage bundling shells out to linuxdeploy, which is itself an
          # AppImage and needs FUSE to mount — GitHub runners have no FUSE, so
          # it died with "failed to run linuxdeploy" on every release since
          # v2.6.0. The .deb and .rpm bundled fine first, but the AppImage
          # failure failed the job, so Linux never uploaded anything at all.
          # Extract-and-run skips the mount entirely.
          APPIMAGE_EXTRACT_AND_RUN: 1
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filey-erp-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            # Updater signatures — without these the artifacts can't be turned
            # into a working latest.json if the release upload ever needs redoing.
            src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: ignore

name: release build

# Desktop installers for macOS, Windows and Linux.
# Trigger: push a tag like `v1.0.0`, or run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action creates the GitHub Release, which needs write access to repo
# contents (otherwise: "Resource not accessible by integration").
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One runner at a time. Both jobs call tauri-action, which looks for a
      # draft release with this tag and creates one if it finds none — run them
      # together and each finds nothing, so the tag ends up with TWO draft
      # releases (v2.3.14 did) whose assets and latest.json have to be merged by
      # hand. Sequential means the second job finds the first job's release and
      # appends to it, giving one release with every platform in one latest.json.
      max-parallel: 1
      matrix:
        include:
          # macOS dropped: needs an Apple Developer signing cert we don't have,
          # and Filey ships as a Windows desktop app. Re-add with the APPLE_*
          # secrets if a notarized .dmg is ever needed.
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            libssl-dev libxdo-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # npm install (not ci): lockfile is Windows-generated and lacks the
      # linux-only optional native deps, so `npm ci` fails on the linux
      # runner. install reconciles per-platform.
      - run: npm install --no-audit --no-fund

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      # The WhatsApp bridge ships as a Tauri sidecar so a QR-paired session can
      # start with the app instead of from a terminal. Compiled to a standalone
      # binary here (Baileys is Node-only), named with the target triple, which
      # is what externalBin resolves at bundle time.
      # Not yet wired into `externalBin`: compiling Baileys to a standalone
      # binary is unproven, and a failure there must never cost every user the
      # rest of a release. This step proves it out first — flip on externalBin
      # once it is green on both runners.
      - uses: oven-sh/setup-bun@v2
        continue-on-error: true
      - name: Build WhatsApp bridge sidecar (proving run)
        continue-on-error: true
        shell: bash
        run: |
          cd tools/wa-bridge
          bun install --frozen-lockfile || bun install
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""
          [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p ../../src-tauri/binaries
          bun build --compile index.mjs \
            --outfile "../../src-tauri/binaries/filey-wa-bridge-$TRIPLE$EXT"
          ls -la ../../src-tauri/binaries

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Filey ERP {0}', github.ref_name) || '' }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filey-erp-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            # Updater signatures — without these the artifacts can't be turned
            # into a working latest.json if the release upload ever needs redoing.
            src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: ignore

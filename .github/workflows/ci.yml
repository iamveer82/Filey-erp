name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit
      - run: node scripts/check-release-recovery.mjs
      # Bridge tests import its isolated Node dependencies, not the web bundle.
      - run: npm ci --prefix tools/wa-bridge --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:rls:local
      - run: node scripts/build-schema-bootstrap.mjs
      - run: node --test scripts/test-runtime-schema-checks.mjs scripts/test-workflow-schema-checks.mjs scripts/test-cloud-privacy-checks.mjs scripts/test-credit-promotion-schema.mjs
      - run: node scripts/test-schema-bootstrap-local.mjs
      - run: node scripts/test-cloud-privacy-local.mjs
      - run: node scripts/test-ai-credit-promotion-local.mjs
      - run: node scripts/test-ai-completion-recovery-local.mjs
      - run: node scripts/test-business-workflows-local.mjs
      - run: node scripts/test-stripe-totals-local.mjs
      - run: node scripts/test-mfa-local.mjs
      - run: node scripts/test-channel-agent-local.mjs
      - run: node --test worker/paths.test.js worker/jobs.test.js worker/runtime.test.js
      - run: npm audit --omit=dev --prefix worker
      - run: npm ci --prefix mcp-server --no-audit --no-fund
      - run: npm audit --omit=dev --prefix mcp-server
      - run: npm run build --prefix mcp-server
      - run: npm run smoke:local --prefix mcp-server
      - run: npm run test:browser:tools
      - run: node tools/wa-bridge/check-media.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Verify compiled WhatsApp media without pairing
        working-directory: tools/wa-bridge
        run: |
          bun build-sidecar.mjs --outfile ../../output/wa-smoke/filey-wa-bridge
          ../../output/wa-smoke/filey-wa-bridge --check-media --media-dir "$(node -p "require('path').resolve('../../output/wa-smoke/wa-media')")"
      - run: npm audit --omit=dev --prefix tools/wa-bridge
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:edge
      - run: deno check --node-modules-dir=none --lock=deno.lock --frozen supabase/functions/integrations/index.ts
      - run: deno check --node-modules-dir=none --lock=deno.lock --frozen supabase/functions/team-invite/index.ts
      - run: deno check --node-modules-dir=none --lock=deno.lock --frozen supabase/functions/ai-video/index.ts supabase/functions/ai-credits/index.ts
      - run: deno check --node-modules-dir=none --lock=deno.lock --frozen supabase/functions/dodo/index.ts supabase/functions/stripe/index.ts supabase/functions/agent-jobs/index.ts supabase/functions/run-tool/index.ts supabase/functions/channel-webhook/index.ts supabase/functions/send-email/index.ts supabase/functions/overdue-reminders/index.ts
      - run: npm run build -- --manifest
      - run: node scripts/check-route-bundles.mjs
      - run: node scripts/test-web-security.mjs --production

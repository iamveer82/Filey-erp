name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Bridge tests import its isolated Node dependencies, not the web bundle.
      - run: npm ci --prefix tools/wa-bridge --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:rls:local
      - run: npm run test:browser:tools
      - run: node tools/wa-bridge/check-media.mjs
      - run: npm audit --omit=dev --prefix tools/wa-bridge
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:edge
      - run: deno check --lock=deno.lock --frozen supabase/functions/integrations/index.ts
      - run: deno check --lock=deno.lock --frozen supabase/functions/team-invite/index.ts
      - run: npm run build -- --manifest
      - run: node scripts/check-route-bundles.mjs

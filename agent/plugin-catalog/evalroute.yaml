name: evalroute
repo: https://github.com/keppy/hermes-plugin-evalroute
sha: 836273c09d28cd5fc6c009ed955837e2014bd1f7
description: 'Route a task to the right (model, reasoning effort) arm before you start. Classifies the task into a lane, prints a provenance-carrying route card, and installs per-model reasoning-effort defaults. Strong rules run locally; weak-signal classification calls the host LLM and consumes tokens. The separate harness and shim can make paid provider calls when explicitly run; no plugin-owned credentials. Disclosure — weak-signal task classification sends the task text to your active Filey model via the host LLM facade (token cost). The model-callable tool, /route, /rate and observed /model and /reasoning commands append task text and command args to a local ledger at <FILEY_HOME>/evalroute/labels.jsonl. "filey evalroute install-routes" rewrites agent.reasoning_overrides in config.yaml when you run it. The bundled harness and Filey shim are never run by the plugin. When run by hand they make paid provider calls, execute model-generated code on the host via shell checkers, and run filey -z with approvals bypassed. Disclosure — "filey evalroute sync" (run by hand) downloads the route table from the Hugging Face dataset keppy/evalroute-flywheel into FILEY_HOME and route cards then show that dataset''s text; "filey evalroute dispatch" (run by hand) spawns a single-query filey chat on the routed model (Nous provider by default) — or, with --runner claude-code, a `claude -p` (Claude Code) process under the user''s own Claude account, whose per-run cost is recorded in the local sidecar — with the brief as its query, inheriting the current environment except FILEY_YOLO_MODE (the worker never inherits --yolo; its approvals follow approvals.single_query_mode, default deny), and writes its report and a .dispatch.json sidecar beside the brief. Disclosure — "filey evalroute contribute" (run by hand only) refuses to run unless evalroute.contribute: true is set in config.yaml, and then uploads redacted outcome rows only — lane, routed arm, confirmed arm, verdict, method, facet counts, ISO week and an HMAC-SHA256 task hash; never task text, notes, paths or the salt — to the user''s own path (contributed/<hf-username>/) in the Hugging Face dataset keppy/evalroute-flywheel using the user''s existing huggingface_hub login; "--dry-run" prints the exact rows and sends nothing; the per-install salt stays local in <FILEY_HOME>/evalroute/contribute.salt. Since evalroute 0.9.1 (schema 2) the same upload also carries lane-correction rows as lane pairs (from_lane, to_lane, method, week) with no task text, plus the max_turns value and harness name the arm ran under. Disclosure — "filey evalroute install-encoder <dir|owner/name>" (run by hand only) downloads a small text-classification model (the default id keppy/evalroute-lane-encoder is a 146 MB ModernBERT fine-tune on the Hugging Face Hub) into <FILEY_HOME>/evalroute/encoder/ and from then on "filey evalroute route" runs it locally, offline, to classify the task when the keyword rules are weak, instead of the LLM call; it needs torch and transformers in the plugin environment (pip extra evalroute[encoder]), which the plugin does not install; "install-encoder --remove" deletes it. "filey evalroute export-cases" (run by hand only) writes your --lane-pinned route rows, task text included, to a local file you name, for training your own encoder; stdout carries counts only and nothing is uploaded. As of 0.6.2 the plugin is a thin adapter: all behaviour lives in the PyPI package evalroute (>=0.9.2,<0.10), declared as a Python dependency that Filey installs on your confirmation.'
maintainer: keppy
tier: community
category: tools
requires_filey: '>=0.21'
version: "0.6.4"
docs_url: https://github.com/keppy/hermes-plugin-evalroute#readme
capabilities:
  provides_tools:
  - evalroute_route
  provides_hooks:
  - pre_llm_call
  - pre_command
  - post_llm_call
  provides_middleware: []
  requires_env: []

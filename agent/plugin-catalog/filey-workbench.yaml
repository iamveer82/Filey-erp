description: The Filey desktop app in your browser. `filey workbench` serves the desktop interface through the Filey dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `filey workbench` run and again after each Filey update it runs `npm install --ignore-scripts` (guided by Filey's lockfile) and Vite against your Filey checkout's desktop sources, writing only under ~/.filey-agent/filey-workbench and its own plugin dir (the checkout is only read), and starts `filey dashboard` on loopback when none is running.

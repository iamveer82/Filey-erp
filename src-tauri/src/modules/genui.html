<div id="content"></div>
<script>
(() => {
  const say = message => parent.postMessage(message, "*");
  const fail = error => {
    const p = document.createElement("pre");
    p.className = "filey-error";
    p.textContent = "This card hit an error: " + ((error && error.message) || error);
    document.body.append(p);
  };
  addEventListener("error", event => fail(event.error || event.message));
  addEventListener("unhandledrejection", event => fail(event.reason));

  const images = {};
  const fillImages = () => {
    for (const img of document.querySelectorAll("img[data-filey-image]")) {
      const src = images[img.dataset.fileyImage];
      if (src && img.getAttribute("src") !== src) img.src = src;
    }
  };
  // The app accepts a follow-up or a link only right after a real click in the card.
  const send = text => say({ type: "filey-ui-prompt", text: String(text == null ? "" : text).slice(0, 2000) });
  const openLink = url => say({ type: "filey-ui-link", url: String(url || "") });
  window.filey = Object.freeze({ send, openLink, images, image: name => images[name] });
  // OpenIntelligentUI's bridge, so cards written for it run unchanged.
  window.Websandbox = Object.freeze({ connection: Object.freeze({ remote: Object.freeze({
    sendPrompt: async ({ text } = {}) => send(text),
    openLink: async ({ url } = {}) => openLink(url),
  }) }) });

  let card = null;
  const run = code => new Promise(resolve => {
    if (!code || !String(code).trim()) return resolve();
    const s = document.createElement("script");
    s.textContent = String(code);
    document.body.append(s);
    resolve();
  });

  // A standalone copy for My Files or a download: the design, the card and its code in one file.
  const standalone = () => {
    const esc = s => String(s).replace(/<\/script/gi, "<\\/script");
    const scripts = [card.jsFunctions, ...(card.jsExpressions || []), card.js].filter(Boolean)
      .map(code => `<script>${esc(code)}<\/script>`).join("\n");
    return `<!doctype html>
<html data-theme="${document.documentElement.dataset.theme || "light"}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${String(card.title || "Filey card").replace(/[<&]/g, "")}</title>
${document.querySelector('script[type="importmap"]').outerHTML}
<style>${document.getElementById("filey-design").textContent}
body { overflow: auto; padding: 16px; max-width: 960px; margin: 0 auto; }</style>
<style>${card.css || ""}</style>
</head>
<body>
<div id="content">${card.html || ""}</div>
<script>
const images = ${JSON.stringify(images).replace(/<\//g, "<\\/")};
for (const img of document.querySelectorAll("img[data-filey-image]")) if (images[img.dataset.fileyImage]) img.src = images[img.dataset.fileyImage];
const send = text => alert("In Filey this button asks Filey AI: " + text);
window.filey = { send, openLink: url => window.open(url, "_blank", "noopener"), images, image: name => images[name] };
window.Websandbox = { connection: { remote: { sendPrompt: async ({ text }) => send(text), openLink: async ({ url }) => window.open(url, "_blank", "noopener") } } };
<\/script>
${scripts}
</body></html>`;
  };

  addEventListener("message", async event => {
    const m = event.data || {};
    if (event.source !== parent) return;
    if (m.type === "filey-ui-images") {
      Object.assign(images, m.images || {});
      fillImages();
      dispatchEvent(new Event("filey-images"));
      return;
    }
    if (m.type === "filey-ui-export" && card) return say({ type: "filey-ui-export", html: standalone() });
    if (m.type !== "filey-ui-render" || card) return;
    card = m;
    document.documentElement.dataset.theme = m.theme === "dark" ? "dark" : "light";
    Object.assign(images, m.images || {});
    if (m.css) document.head.append(Object.assign(document.createElement("style"), { textContent: String(m.css) }));
    const root = document.getElementById("content");
    root.classList.add("initial-render");
    root.innerHTML = String(m.html || "");
    setTimeout(() => root.classList.remove("initial-render"), 1200);
    fillImages();
    // Scripts set through innerHTML never run: re-create them in order, waiting for each library.
    for (const old of [...root.querySelectorAll("script")]) {
      const s = document.createElement("script");
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      if (old.src) {
        await new Promise(resolve => { s.onload = s.onerror = resolve; old.replaceWith(s); });
      } else {
        s.textContent = old.textContent;
        old.replaceWith(s);
      }
    }
    await run(m.jsFunctions);
    for (const expression of m.jsExpressions || []) await run(expression);
    await run(m.js);
    say({ type: "filey-ui-rendered" });
    const size = () => say({ type: "filey-ui-size", height: Math.ceil(document.documentElement.getBoundingClientRect().height) });
    new ResizeObserver(size).observe(document.documentElement);
    size();
  });
  say({ type: "filey-ui-ready" });
})();
</script>

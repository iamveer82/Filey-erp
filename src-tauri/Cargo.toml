[package]
name = "filey-erp"
version = "0.1.3"
description = "Filey ERP — offline-first desktop ERP for small businesses"
authors = ["iamveer82"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "filey_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport",
  "builder",
  "rustls-tls",
] }
# HTTP client for the Composio bridge (managed integrations: Gmail/Slack/etc).
# rustls to share lettre's TLS stack; `json` for send_json/into_json.
ureq = { version = "2", features = ["json"] }
# At-rest encryption for My Files blobs. Key is random, stored in the OS secure
# store (Windows Credential Manager) via `keyring` — transparent per-user unlock.
aes-gcm = "0.10"
rand = "0.8"
keyring = "2"
base64 = "0.22"


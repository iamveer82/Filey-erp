project_id = "filey-erp"


[auth.email.template.recovery]
subject = "Reset your Filey password"
content_path = "./supabase/templates/recovery.html"

# Dodo webhooks verify their signature; customer actions validate auth.getUser.
[functions.dodo]
verify_jwt = false

# The handler validates the current account with auth.getUser.
[functions.ai-credits]
verify_jwt = false

# User requests verify auth.getUser; callbacks verify an opaque per-job token
# and independently retrieve the provider's status before touching credits.
[functions.ai-video]
verify_jwt = false

# send-email verifies the session with auth.getUser before every action.
[functions.send-email]
verify_jwt = false

# Validate current signing keys inside the function.
[functions.integrations]
verify_jwt = false

# Stripe verifies webhook signatures; account actions validate auth.getUser.
[functions.stripe]
verify_jwt = false

# Cron jobs verify their configured server-only trigger secret.
[functions.agent-jobs]
verify_jwt = false

# Incoming channels verify provider signatures or their bridge secret.
[functions.channel-webhook]
verify_jwt = false

# Reminder cron requests verify the configured server-only trigger secret.
[functions.overdue-reminders]
verify_jwt = false

# Invitations validate the current account with auth.getUser.
[functions.team-invite]
verify_jwt = false

# Keep the existing gateway JWT check; the handler also validates auth.getUser.
[functions.run-tool]
verify_jwt = true

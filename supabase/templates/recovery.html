<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;padding:32px 16px;background:#f4f4f5;color:#18181b;font-family:Arial,Helvetica,sans-serif">
    <div style="max-width:480px;margin:0 auto;padding:32px;background:#ffffff;border-radius:16px">
      <p style="margin:0 0 24px;font-size:18px;font-weight:700">Filey</p>
      <h1 style="margin:0 0 16px;font-size:26px;line-height:1.2">Reset your password</h1>
      <p style="font-size:16px;line-height:1.6">We received a request to reset your Filey password. Choose a new password using the button below.</p>
      <p style="margin:28px 0">
        <a href="{{ .SiteURL }}/#/reset-password?token_hash={{ .TokenHash }}&amp;email={{ .Email | urlquery }}" style="display:inline-block;background:#ffd600;color:#18181b;border-radius:999px;padding:14px 24px;font-size:16px;font-weight:600;text-decoration:none">Reset password</a>
      </p>
      <p style="font-size:14px;line-height:1.6;color:#52525b">This link expires and can be used once. If you didn't request it, you can ignore this email. Your password will stay the same.</p>
      <p style="margin:24px 0 0;font-size:13px;color:#52525b">Filey ERP</p>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/filey-logo.svg" />
    <link rel="apple-touch-icon" href="/filey-logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFD600" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Filey" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.supabase.in https://api.openai.com https://api.anthropic.com https://openrouter.ai https://api.groq.com https://api.moonshot.cn https://api.deepseek.com http://localhost:* https:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta
      name="description"
      content="Filey — AI-powered ERP, CRM and a full suite of in-browser PDF tools: merge, split, e-sign, stamp, watermark, redact, rotate and convert."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Filey — AI ERP, CRM & PDF Tools" />
    <meta
      property="og:description"
      content="Run your business and edit PDFs in one place. Merge, split, e-sign, stamp, redact and convert — fast, private, in-browser."
    />
    <meta property="og:image" content="/filey-logo.svg" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://voyrjqgaypiylwskkwpr.supabase.co" />
    <!-- Non-render-blocking: paint immediately with the system font and swap
         the web fonts in once they load. Offline (desktop) never stalls waiting
         on the CDN — the request fails silently and the system font stays. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;510;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:wght@300;400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;510;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:wght@300;400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Filey — AI ERP, CRM & PDF Tools</title>
    <style>
      /* Pre-mount boot splash: shown the instant the HTML paints — before any
         JS or app CSS — and replaced automatically when React renders into
         #root. Mirrors components/FileyLoader so there's no visual jump. */
      @keyframes filey-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fdfdfd;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
      }
      #boot-splash h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0a0a0a;
      }
      #boot-splash svg {
        animation: filey-boot-spin 1s linear infinite;
        transform-origin: 50% 50%;
      }
      html.dark #boot-splash {
        background: #15161a;
      }
      html.dark #boot-splash h1 {
        color: #f4f5f6;
      }
    </style>
    <script>
      // Set theme before paint to avoid a flash of the wrong scheme.
      (function () {
        try {
          var t = localStorage.getItem("theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading Filey">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
          <h1>Filey</h1>
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6" fill="none" stroke="#C9CBD6" stroke-width="2" />
            <path
              d="M8 2 a6 6 0 0 1 6 6"
              fill="none"
              stroke="#2563EB"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

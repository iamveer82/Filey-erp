<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/filey-mascot.png" />
    <link rel="apple-touch-icon" href="/icons/filey-ios-v1.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFD600" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Filey" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' blob: data: https://*.supabase.co https://*.supabase.in https://api.openai.com https://api.anthropic.com https://openrouter.ai https://api.groq.com https://api.moonshot.cn https://api.deepseek.com http://localhost:* https:; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta
      name="description"
      content="Filey — AI-powered ERP, CRM and a full suite of in-browser PDF tools: merge, split, e-sign, stamp, watermark, redact, rotate and convert."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Filey — AI ERP, CRM & PDF Tools" />
    <meta
      property="og:description"
      content="Run your business and edit PDFs in one place. Merge, split, e-sign, stamp, redact and convert — fast, private, in-browser."
    />
    <meta property="og:image" content="/filey-logo.svg" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://voyrjqgaypiylwskkwpr.supabase.co" />
    <!-- Fonts are self-hosted (@fontsource-variable/inter, imported in
         main.tsx). No Google Fonts CDN — the app renders correctly offline and
         never stalls on a network font request at launch. -->
    <title>Filey — AI ERP, CRM & PDF Tools</title>
    <style>
      /* Pre-mount boot splash: shown the instant the HTML paints — before any
         JS or app CSS — and replaced automatically when React renders into
         #root. Mirrors components/FileyLoader so there's no visual jump. */
      @keyframes filey-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fdfdfd;
        font-family: Inter, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
      }
      #boot-splash h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #0a0a0a;
      }
      #boot-splash .boot-mark { position: relative; width: 64px; height: 64px; display: grid; place-items: center; }
      #boot-splash svg { position: absolute; inset: 0; color: #faca1a; }
      #boot-splash svg g {
        animation: filey-boot-spin 900ms linear infinite;
        transform-origin: 12px 12px;
      }
      #boot-splash p { margin: 4px 0 0; font-size: 12px; color: #62626a; }
      html.dark #boot-splash {
        background: #0a0a0a;
      }
      html.dark #boot-splash h1 {
        color: #f4f5f6;
      }
      html.dark #boot-splash p { color: #a1a1a1; }
      @media (prefers-reduced-motion: reduce) { #boot-splash svg g { animation: none; } }
    </style>
    <script>
      // Apply the small visual preferences before paint, even when local
      // storage is unavailable. The cookies never contain account data.
      (function () {
        try {
          function preference(key, cookie) {
            try { var saved = localStorage.getItem(key); if (saved) return saved; } catch (e) {}
            try {
              var part = document.cookie.split(/;\s*/).find(function (value) { return value.indexOf(cookie + "=") === 0; });
              return part ? decodeURIComponent(part.slice(cookie.length + 1)) : "";
            } catch (e) { return ""; }
          }
          var t = preference("theme", "filey_theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var accent = preference("filey-accent", "filey_accent");
          if (/^(amber|blue|emerald|rose|violet|sky|slate)$/.test(accent))
            document.documentElement.dataset.accent = accent;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading Filey">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
          <div class="boot-mark">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" opacity="0.16" />
              <g><path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" /><circle cx="12" cy="21" r="1.25" fill="currentColor" opacity="0.45" /></g>
            </svg>
            <img src="/icons/filey-logo.png" alt="" width="32" height="32" />
          </div>
          <div style="text-align: center"><h1>Filey</h1><p>Loading Filey</p></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
